<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danilo Henriques — Product Designer</title>
  <meta name="description" content="Portfolio of Danilo Henriques, Product Designer living in Santos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <header class="site-header" id="top">
    <a class="btn-soft" id="about-link" href="#">About</a>
    <h1 class="site-name">Danilo Henriques</h1>
    <a class="btn-contact" href="#contact">Contact now</a>
  </header>

  <main class="home">
    <div class="timeline" aria-live="polite"></div>
  </main>

  <section class="talk" id="contact" aria-labelledby="talk-title">
    <a class="btn-top" href="#top" aria-label="Back to top">
      <img src="assets/img/icon-arrow-up.svg" width="16" height="16" alt="">
    </a>
    <div class="talk-body">
      <div class="talk-copy">
        <h2 class="talk-title" id="talk-title"></h2>
        <div class="talk-cta">
          <p class="talk-text"></p>
          <a class="btn-contact" id="talk-contact" href="#">Contact now</a>
        </div>
      </div>
      <img class="talk-smile" src="assets/img/smile.svg" width="160" height="160" alt="">
      <div class="talk-photo"></div>
    </div>
    <div class="talk-chips"></div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</html>
